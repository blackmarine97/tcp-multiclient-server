# radar_server configuration ("key = value", '#' starts a comment)

bind_address          = 0.0.0.0
tcp_port              = 8088
max_clients           = 3

# Producer: one fake track frame every frame_interval_ms
frame_interval_ms     = 35
tracks_per_frame      = 64
# UDP datagram size limit (20-byte fragment header included).
# 64 tracks = 1552 bytes -> 4 fragments per frame at 512.
max_datagram_bytes    = 512

# Liveness: server sends "HB <n>" every heartbeat_interval_ms; a client that
# sends nothing for zombie_timeout_ms is treated as a zombie and released.
heartbeat_interval_ms = 1000
zombie_timeout_ms     = 3500

# Per-client frame queue between producer and sender thread
queue_capacity        = 8
queue_overflow        = drop_oldest   # drop_oldest | drop_newest

# Periodic stats log (needs log_level = info); 0 turns it off
stats_interval_ms     = 5000

max_line_bytes        = 256
log_level             = info          # debug | info | warn | error | off
